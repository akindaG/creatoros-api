name: Backend CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creatoros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/creatoros_test
      JWT_SECRET_KEY: github-actions-test-secret
      APP_ENV: test
      OLLAMA_BASE_URL: http://127.0.0.1:9
      OLLAMA_TIMEOUT_SECONDS: "0.2"
      AI_FALLBACK_ENABLED: "true"
      SOCIAL_PUBLISH_MODE: simulate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m pytest -q --cov=app --cov-report=term-missing
